name: Signaler une erreur
description: Un actionnaire, un rattachement ou une marque est faux ou a changé.
title: "Correction : "
labels: ["correction"]
body:
  - type: input
    id: fiche
    attributes:
      label: Fiche concernée
      description: Rempli automatiquement depuis le site (m:… pour une marque, g:… pour un groupe).
    validations:
      required: true
  - type: textarea
    id: erreur
    attributes:
      label: Ce qui est faux
      description: Et ce qui serait juste (actionnaire, part, rachat, date…).
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Lien vers un document qui l'établit (communiqué, rapport annuel, presse, registre).
    validations:
      required: true
