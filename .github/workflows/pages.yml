# Publie docs/ sur GitHub Pages. La validation des données passe d'abord :
# une donnée invalide bloque la publication.
name: pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/validate_data.py", "scripts/check_site.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Valider les données
        run: python3 scripts/validate_data.py
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Le code doit lire ces données sans planter : une erreur ici donnerait
      # une page blanche en ligne, que la validation des JSON ne voit pas.
      - name: Contrôler le site
        run: |
          for f in docs/js/*.js docs/js/views/*.js; do node --check "$f"; done
          node scripts/check_site.mjs
      # Pages garde chaque fichier 10 min en cache : sans version dans l'URL, un
      # navigateur peut mêler la nouvelle page et l'ancien code. Chaque
      # déploiement remplace donc le jeton '?v=dev' par l'identifiant du commit.
      - name: Versionner les ressources
        run: |
          v="${GITHUB_SHA::8}"
          find docs \( -name '*.html' -o -name '*.js' \) -exec sed -i "s/?v=dev/?v=$v/g" {} +
          ! grep -rq '?v=dev' docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
