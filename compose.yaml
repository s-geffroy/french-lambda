# Un worker : du travail de fond, aucune surface HTTP. Donc pas de labels
# Traefik, pas de reseau edge, et 'exposure: none' dans app.yaml -- appctl
# refuse l'un sans l'autre.
services:
  worker:
    build:
      context: ./src
    restart: unless-stopped
    networks:
      - internal
    environment:
      APP_NAME: french-lambda
      TZ: Europe/Paris
      WORKER_INTERVAL: "30"
    volumes:
      - state:/state
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 128
    healthcheck:
      # Le worker touche /tmp/heartbeat a chaque tour : le conteneur est sain
      # tant que ce fichier est recent. Le seuil doit rester superieur a deux
      # fois WORKER_INTERVAL. 'Sain' veut dire "la boucle tourne", pas "le
      # travail reussit" -- ca, ce sont les logs qui le disent.
      # Les '$$' sont des '$' : Docker Compose interprete un '$' seul.
      test: ["CMD", "sh", "-c", "[ $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 180 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 'docker stop' laisse 10 s avant le SIGKILL. Le worker s'arrete a la fin du
    # cycle en cours : si un cycle peut durer plus longtemps, augmenter ici.
    stop_grace_period: 30s

  # Outil jetable, jamais demarre par 'up' : 'sudo appctl run gh <args>' pour
  # gh, 'sudo appctl run gh git <args>' pour git (push en HTTPS via gh).
  gh:
    profiles: ["cli"]
    build:
      context: ./tools/gh
    networks:
      - internal
    volumes:
      - .:/work
    secrets:
      - gh_token
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 128

networks:
  internal:
    name: french-lambda-internal
    external: true

# Fine-grained token GitHub, limite au depot french-lambda. Fichier en 0444 :
# le conteneur tourne en utilisateur non privilegie.
secrets:
  gh_token:
    file: /etc/app-secrets/french-lambda/gh_token

volumes:
  state:
    name: french-lambda_state
